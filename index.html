<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CDK 虚拟卡查询</title>
<style>
:root{
  --page:#10141d;
  --surface:#171d28;
  --surface-2:#1f2633;
  --line:#30394b;
  --line-soft:#263044;
  --text:#f6f8fc;
  --muted:#aab5c7;
  --accent:#52d6c4;
  --accent-2:#f2c15c;
  --danger:#f06b82;
  --shadow:0 20px 50px rgba(0,0,0,.28);
}

body[data-theme="light"]{
  --page:#f6faf8;
  --surface:#ffffff;
  --surface-2:#f8fbff;
  --line:#d6e0ea;
  --line-soft:#e1e8f0;
  --text:#14202e;
  --muted:#667386;
  --accent:#0fa38d;
  --accent-2:#dd9a20;
  --danger:#d95067;
  --shadow:0 20px 50px rgba(43,67,87,.14);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  padding:24px 14px;
  color:var(--text);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:
    linear-gradient(135deg, rgba(82,214,196,.12), transparent 32%),
    linear-gradient(225deg, rgba(242,193,92,.10), transparent 28%),
    var(--page);
}

body[data-theme="light"]{
  background:
    linear-gradient(135deg, rgba(15,163,141,.13), transparent 30%),
    linear-gradient(225deg, rgba(221,154,32,.16), transparent 26%),
    var(--page);
}

.wrap{
  width:min(100%, 960px);
  margin:0 auto;
}

.shell{
  padding:22px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(23,29,40,.92);
  box-shadow:var(--shadow);
}

body[data-theme="light"] .shell{
  background:rgba(255,255,255,.92);
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:14px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand{
  font-size:24px;
  font-weight:800;
}

.badge{
  padding:7px 10px;
  border:1px solid rgba(82,214,196,.38);
  border-radius:999px;
  color:#d7fff8;
  background:rgba(82,214,196,.08);
  font-size:12px;
}

body[data-theme="light"] .badge{
  color:#075e52;
  border-color:rgba(15,163,141,.28);
  background:rgba(15,163,141,.10);
}

.theme-toggle{
  display:inline-flex;
  align-items:center;
  gap:8px;
  height:34px;
  padding:4px 10px 4px 5px;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--text);
  background:var(--surface-2);
  cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}

.theme-knob{
  display:grid;
  place-items:center;
  width:24px;
  height:24px;
  border-radius:50%;
  color:#121720;
  background:linear-gradient(135deg, var(--accent-2), #ffe18a);
  font-size:13px;
  font-weight:900;
}

.theme-text{
  font-size:13px;
  font-weight:750;
}

.notice{
  display:grid;
  gap:8px;
  margin-bottom:16px;
  padding:13px 15px;
  border:1px solid rgba(240,107,130,.35);
  border-radius:8px;
  color:#fff0f3;
  background:linear-gradient(135deg, rgba(121,28,47,.9), rgba(70,18,31,.95));
  font-size:15px;
  font-weight:700;
}

.notice-rule{
  color:#ffe08a;
  font-size:14px;
  line-height:1.7;
}

.main-grid{
  display:grid;
  grid-template-columns:minmax(0, 1.1fr) minmax(280px, .9fr);
  gap:14px;
}

.panel{
  padding:16px;
  border:1px solid var(--line-soft);
  border-radius:8px;
  background:var(--surface-2);
}

.card-panel{
  position:relative;
  overflow:hidden;
  margin-top:14px;
}

.card-panel.copy-ready{
  border-color:rgba(82,214,196,.62);
  box-shadow:0 0 0 1px rgba(82,214,196,.16), 0 18px 44px rgba(82,214,196,.10);
}

.card-panel.copy-ready::after{
  content:"";
  position:absolute;
  top:0;
  left:-45%;
  width:34%;
  height:100%;
  pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
  animation:scan 2.8s ease-in-out infinite;
}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}

.panel-title{
  color:#eff4ff;
  font-size:14px;
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase;
}

body[data-theme="light"] .panel-title{
  color:#182435;
}

.hint{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 11px;
  border:1px solid rgba(82,214,196,.42);
  border-radius:999px;
  color:#dffdf8;
  background:linear-gradient(135deg, rgba(82,214,196,.18), rgba(242,193,92,.12));
  box-shadow:0 0 18px rgba(82,214,196,.16);
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}

.hint::before{
  content:"";
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 5px rgba(82,214,196,.12), 0 0 14px var(--accent);
}

body[data-theme="light"] .hint{
  color:#075e52;
  background:linear-gradient(135deg, rgba(15,163,141,.14), rgba(221,154,32,.16));
  box-shadow:0 10px 24px rgba(15,163,141,.10);
}

.field-label{
  display:block;
  margin-bottom:8px;
  color:#dbe3f0;
  font-size:14px;
  font-weight:650;
}

body[data-theme="light"] .field-label{
  color:#263449;
}

input{
  width:100%;
  padding:14px 15px;
  border:1px solid #3a4558;
  border-radius:8px;
  outline:none;
  background:var(--surface);
  color:var(--text);
  font-size:16px;
  transition:border-color .18s ease, box-shadow .18s ease;
}

input::placeholder{color:#7f8ba0}

input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(82,214,196,.14);
}

.actions{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.btn{
  flex:1;
  min-height:46px;
  padding:11px 14px;
  border:none;
  border-radius:8px;
  color:#10141d;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:transform .16s ease, filter .16s ease;
}

.btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.04);
}

.btn:active{
  transform:translateY(0);
}

.btn-primary{
  background:linear-gradient(135deg, var(--accent), #7cf0a5);
}

.btn-secondary{
  color:#14110a;
  background:linear-gradient(135deg, var(--accent-2), #ffd778);
}

.status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-height:36px;
  margin-top:13px;
  padding:9px 11px;
  border-radius:8px;
  background:var(--surface);
  color:#cfd8e8;
  font-size:14px;
}

body[data-theme="light"] .status{
  color:#536276;
}

.status-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--accent);
}

.countdown{
  display:none;
  margin-top:12px;
  padding:12px 13px;
  border:1px solid rgba(240,107,130,.28);
  border-radius:8px;
  color:#ffe8ee;
  background:#451925;
  font-weight:800;
}

.link-area{
  min-height:132px;
  line-height:1.8;
  word-break:break-all;
}

.card-info{
  min-height:260px;
  border-radius:8px;
}

.card-info.has-data{
  padding:0 8px;
  outline:1px solid rgba(82,214,196,.18);
  outline-offset:8px;
  transition:outline-color .18s ease, background .18s ease;
}

.card-info.has-data:hover{
  background:rgba(82,214,196,.035);
  outline-color:rgba(82,214,196,.5);
}

.empty{
  color:var(--muted);
  line-height:1.8;
}

.kv{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:10px 16px;
  padding:12px 0;
  border-bottom:1px solid rgba(170,181,199,.14);
}

.kv:last-child{
  border-bottom:none;
}

.k{
  color:#9ba8bb;
}

.v{
  color:#f5f7fb;
  word-break:break-all;
}

.copy-value{
  cursor:pointer;
  border-radius:6px;
  padding:3px 6px;
  margin:-3px -6px;
  transition:background .16s ease, color .16s ease, box-shadow .16s ease;
}

.copy-value:hover{
  color:#10141d;
  background:linear-gradient(135deg, var(--accent), #7cf0a5);
  box-shadow:0 8px 22px rgba(82,214,196,.18);
}

body[data-theme="light"] .k{
  color:#6b7788;
}

body[data-theme="light"] .v{
  color:#182435;
}

.highlight{
  color:#ffdf8a;
  font-weight:800;
}

.copy-toast{
  min-height:24px;
  margin-top:10px;
  color:var(--accent);
  font-size:14px;
  font-weight:800;
}

@keyframes scan{
  0%{transform:translateX(0);opacity:0}
  24%{opacity:1}
  58%{opacity:.8}
  100%{transform:translateX(430%);opacity:0}
}

a{
  color:var(--accent);
  text-decoration:none;
}

a:hover{text-decoration:underline}

.consent-modal{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  place-items:center;
  padding:18px;
  background:rgba(5,8,13,.72);
  backdrop-filter:blur(10px);
}

.consent-modal.is-open{
  display:grid;
}

.consent-dialog{
  width:min(100%, 520px);
  padding:22px;
  border:1px solid rgba(240,107,130,.45);
  border-radius:10px;
  color:var(--text);
  background:linear-gradient(155deg, var(--surface-2), var(--surface));
  box-shadow:0 28px 80px rgba(0,0,0,.44), 0 0 0 1px rgba(255,255,255,.04);
}

.consent-title{
  margin-bottom:12px;
  color:#ffe08a;
  font-size:20px;
  font-weight:900;
}

.consent-text{
  display:grid;
  gap:10px;
  color:var(--text);
  font-size:15px;
  line-height:1.8;
}

.consent-action{
  width:100%;
  min-height:48px;
  margin-top:18px;
  border:none;
  border-radius:8px;
  color:#10141d;
  background:linear-gradient(135deg, var(--accent-2), #ffe18a);
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 14px 28px rgba(242,193,92,.18);
}

.consent-action:hover{
  filter:brightness(1.04);
}

body.modal-open{
  overflow:hidden;
}

@media (max-width:760px){
  .shell{
    padding:16px;
  }

  .topbar{
    align-items:flex-start;
    flex-direction:column;
  }

  .top-actions{
    width:100%;
    justify-content:space-between;
  }

  .main-grid{
    grid-template-columns:1fr;
  }

  .actions{
    flex-direction:column;
  }

  .kv{
    grid-template-columns:1fr;
    gap:5px;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="shell">
    <div class="topbar">
      <div class="brand">CDK 虚拟卡查询</div>
      <div class="top-actions">
        <div class="badge">shop.inian.one</div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换日夜模式">
          <span class="theme-knob" id="themeIcon">日</span>
          <span class="theme-text" id="themeText">白天</span>
        </button>
      </div>
    </div>

    <div class="notice">
      <div>如有任何问题，请及时加入我们的福利售后 QQ 群：1087559405 获取帮助。</div>
      <div class="notice-rule">虚拟产品，激活开卡后不退，业务需自行测试，不保证成功！点开卡查询激活后默认同意此规则！</div>
      <div class="notice-rule">进群，群主 krio 绑卡高手可以咨询，低价 GPT Plus 只需要个位数！</div>
    </div>

    <div class="main-grid">
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">Control Panel</div>
        </div>

        <label class="field-label" for="cdk">CDK 激活码</label>
        <input type="text" id="cdk" placeholder="请输入卡密" />

        <div class="actions">
          <button class="btn btn-primary" id="queryBtn">开卡查询</button>
          <button class="btn btn-secondary" id="verifyBtn">获取3DS验证码</button>
        </div>

        <div class="status" id="statusBar">
          <span class="status-dot"></span>
          <span id="statusText">等待操作</span>
        </div>

        <div class="countdown" id="countdown"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">3DS 验证码</div>
        </div>
        <div class="link-area" id="smsLink">
          <div class="empty">点击获取后会自动打开验证码窗口...</div>
        </div>
      </div>
    </div>

    <div class="panel card-panel">
      <div class="panel-head">
        <div class="panel-title">Card Info</div>
        <div class="hint">查询后轻点卡片字段信息可复制</div>
      </div>
      <div class="card-info" id="cardInfo">
        <div class="empty">等待查询结果...</div>
      </div>
      <div class="copy-toast" id="copyToast" aria-live="polite"></div>
    </div>
  </div>
</div>

<div class="consent-modal" id="activationNotice" role="dialog" aria-modal="true" aria-labelledby="activationNoticeTitle">
  <div class="consent-dialog">
    <div class="consent-title" id="activationNoticeTitle">开卡规则提示</div>
    <div class="consent-text">
      <p>开卡查询激活后，不予退款（包括绑卡失败、拒绝绑卡等情况）。</p>
      <p>介意请勿操作，关闭窗口联系客服退款。接受则继续前往激活。</p>
    </div>
    <button class="consent-action" id="activationNoticeBtn" type="button">我已知悉，不再提示！</button>
  </div>
</div>

<script>
const countdownEl = document.getElementById("countdown");
const cardInfoEl = document.getElementById("cardInfo");
const cardPanelEl = document.querySelector(".card-panel");
const smsLinkEl = document.getElementById("smsLink");
const statusTextEl = document.getElementById("statusText");
const cdkEl = document.getElementById("cdk");
const queryBtn = document.getElementById("queryBtn");
const verifyBtn = document.getElementById("verifyBtn");
const copyToastEl = document.getElementById("copyToast");
const themeToggle = document.getElementById("themeToggle");
const themeIcon = document.getElementById("themeIcon");
const themeText = document.getElementById("themeText");
const activationNoticeEl = document.getElementById("activationNotice");
const activationNoticeBtn = document.getElementById("activationNoticeBtn");

let autoCancelTime = null;
let timer = null;
let toastTimer = null;
const activationNoticeKey = "activationNoticeAcceptedDate";

function applyTheme(theme) {
  document.body.dataset.theme = theme;
  themeIcon.textContent = theme === "light" ? "日" : "夜";
  themeText.textContent = theme === "light" ? "白天" : "夜间";
  localStorage.setItem("cardTheme", theme);
}

function getTodayValue() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const day = String(now.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function showActivationNoticeIfNeeded() {
  try {
    if (localStorage.getItem(activationNoticeKey) === getTodayValue()) return;
  } catch (error) {
    // If storage is blocked, still show the rule once for this page load.
  }

  activationNoticeEl.classList.add("is-open");
  document.body.classList.add("modal-open");
}

function acceptActivationNotice() {
  try {
    localStorage.setItem(activationNoticeKey, getTodayValue());
  } catch (error) {
    // Storage can fail in private modes; closing the modal should still work.
  }

  activationNoticeEl.classList.remove("is-open");
  document.body.classList.remove("modal-open");
}

function setStatus(text) {
  statusTextEl.textContent = text;
}

function showCopyMessage(text) {
  copyToastEl.textContent = text;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    copyToastEl.textContent = "";
  }, 2200);
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function renderCardInfo(data) {
  const expiry = `${String(data.expiryMonth).padStart(2, "0")}/${String(data.expiryYear).slice(-2)}`;
  const fields = [
    ["卡号", data.cardNumber || "-"],
    ["CVV", data.cvv || "-"],
    ["有效期", expiry, "highlight"],
    ["账单地址", data.billingAddress || "-"],
    ["持卡人", data.nameOnCard || "-"],
    ["状态", data.status || "-"]
  ];

  cardInfoEl.classList.add("has-data");
  cardPanelEl.classList.add("copy-ready");
  cardInfoEl.innerHTML = fields.map(([label, value, extraClass = ""]) => `
    <div class="kv">
      <div class="k">${label}</div>
      <div class="v ${extraClass} copy-value" data-copy="${escapeHtml(value)}" data-label="${label}">${escapeHtml(value)}</div>
    </div>
  `).join("");
}

function startCountdown() {
  if (timer) clearInterval(timer);
  countdownEl.style.display = "block";

  timer = setInterval(() => {
    const diff = autoCancelTime - Date.now();

    if (diff <= 0) {
      countdownEl.textContent = "卡片已自动销卡";
      clearInterval(timer);
      return;
    }

    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    countdownEl.textContent = `距离自动销卡：${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }, 1000);
}

async function postJson(url, payload) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await res.json();
  if (!res.ok || !data.success) {
    throw new Error(data.message || "请求失败");
  }
  return data;
}

async function queryCard() {
  const code = cdkEl.value.trim();
  if (!code) {
    setStatus("请输入 CDK 激活码");
    return;
  }

  setStatus("正在查询卡片...");
  copyToastEl.textContent = "";
  cardInfoEl.classList.remove("has-data");
  cardPanelEl.classList.remove("copy-ready");
  cardInfoEl.innerHTML = '<div class="empty">正在查询，请稍候...</div>';
  countdownEl.style.display = "none";

  try {
    const result = await postJson("/api/query-card", { code });
    renderCardInfo(result.data);

    if (result.data.autoCancelAt) {
      autoCancelTime = new Date(result.data.autoCancelAt).getTime();
      startCountdown();
    }

    setStatus("查询成功");
  } catch (error) {
    cardInfoEl.innerHTML = `<div class="empty">${error.message}</div>`;
    setStatus("查询失败");
  }
}

async function get3DS() {
  const code = cdkEl.value.trim();
  if (!code) {
    setStatus("请输入 CDK 激活码");
    return;
  }

  const verifyWindow = window.open("", "_blank");
  if (verifyWindow) {
    verifyWindow.document.write("<title>3DS 验证码</title><p style=\"font-family:sans-serif;padding:20px\">正在获取 3DS 验证码，请稍候...</p>");
  }

  setStatus("正在获取 3DS 验证码...");
  smsLinkEl.innerHTML = '<div class="empty">正在获取 3DS 验证码，请稍候...</div>';

  try {
    const result = await postJson("/api/3ds-link", { code, minutes: 5 });
    const url = result.data.smsUrl || "";

    if (url.startsWith("http")) {
      if (verifyWindow) {
        verifyWindow.location.href = url;
      }
      smsLinkEl.innerHTML = `3DS 验证码窗口已打开：<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
    } else {
      if (verifyWindow) {
        verifyWindow.close();
      }
      smsLinkEl.textContent = `3DS 验证码：${url || "暂无链接"}`;
    }

    setStatus("3DS 验证码已打开");
  } catch (error) {
    if (verifyWindow) {
      verifyWindow.close();
    }
    smsLinkEl.innerHTML = `<div class="empty">${error.message}</div>`;
    setStatus("获取 3DS 验证码失败");
  }
}

async function copyTextToClipboard(text) {
  await navigator.clipboard.writeText(text);
}

async function copyCardField(event) {
  const target = event.target.closest(".copy-value");
  if (!target) return;

  const value = target.dataset.copy || target.textContent.trim();
  const label = target.dataset.label || "字段";

  try {
    await copyTextToClipboard(value);
    showCopyMessage(`已复制${label}`);
  } catch (error) {
    const textarea = document.createElement("textarea");
    textarea.value = value;
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand("copy");
    textarea.remove();
    showCopyMessage(`已复制${label}`);
  }
}

queryBtn.addEventListener("click", queryCard);
verifyBtn.addEventListener("click", get3DS);
cardInfoEl.addEventListener("click", copyCardField);
activationNoticeBtn.addEventListener("click", acceptActivationNotice);
themeToggle.addEventListener("click", () => {
  const nextTheme = document.body.dataset.theme === "light" ? "dark" : "light";
  applyTheme(nextTheme);
});
cdkEl.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    queryCard();
  }
});

applyTheme(localStorage.getItem("cardTheme") || "dark");
showActivationNoticeIfNeeded();
</script>
</body>
</html>
